[project]
name="nym_node_reward_tracker"
version = "0.1.0"
description = "Track Nym node rewards and export reward withdrawal transactions"
readme = "README.md"
requires-python=">=3.12"
authors = [{ name = "cs224", email = "681072+cs224@users.noreply.github.com" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "openpyxl>=3.1",
  "pip>=25.3",
  "tinycss2>=1.4.0",
  "bleach>=6.2.0",
  "requests>=2.32",
  "pyyaml>=6.0",
  "colorama>=0.4.6",
  "tabulate>=0.9",
  "tqdm>=4.66",
  "pydantic>=2.11",
]

[project.scripts]
nym-node-reward-tracker = "nym_node_reward_tracker.cli:main"

[dependency-groups]
dev = [
  "nbdev>=2.3.24",
  "notebook>=7.5.0",
  "nbconvert>=7.16.6",
  "nbclassic>=1.3.3",
  "jupyterlab-quarto>=0.3.5",
  "pytest>=8",
  "watermark>=2.4",
  "matplotlib>=3.8",
  "seaborn>=0.13.2",
  "ghp-import>=2.1.0",
]

# UV_OFFLINE=1 uv run nbdev_export
#  or
# uv run --offline
[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.nbdev]
nbs_path = "nbs"
lib_path = "nym_node_reward_tracker"

[tool.uv]
cache-dir = "./.uv-cache"
